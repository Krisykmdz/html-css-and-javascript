<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <style>
      body{
        background: rgb(25, 25, 25);
      }

      .title {
        font-family: Arial;
        font-weight: 600;
        font-size: 30px;
        color: white;
      }

      .emoji {
        background-color: rgb(25, 25, 25);
        border:3px solid white;
        border-radius: 60px;
        height:120px;
        width: 120px;
        margin-right: 10px;
        cursor: pointer;
      }

      .pic {
        height:50px;
        width:50px;
      }

      .result-two {
        font-size: 25px;
        font-family: Arial;
        font-weight: 600;
        color: white;
        margin-top:50px;
      }

      .result-three {
        display: none;
        font-size: 16px;
        font-family: Arial;
        color: white;
      }

      .computer, .human {
        height: 50px;
        width: 50px;
      }

      .result {
        font-family: Arial;
        color: white;
        margin-top: 60px;
      }

      .button {
        font-size: 15px;
        padding:8px 15px;
        border: none;
        background-color: white;
        cursor: pointer;
      }
    </style>
  </head>

  <body>

    <p class="title">Rock Paper Scissors</p>

    <button class="emoji" onclick="playGame('Rock')">
      <img class="pic" src="images lesson6/rock-emoji.png">
    </button>

    <button class="emoji" onclick="playGame('Paper')">
      <img class="pic" src="images lesson6/paper-emoji.png">
    </button>

    <button class="emoji" onclick="playGame('Scissors')">
      <img class="pic" src="images lesson6/scissors-emoji.png">
    </button>

    <p class="result-two"></p>

    <p class="result-three">
      You
      <img class="human" src="">
      <img class="computer" src="">
      Computer
    </p>

    <p class="result">
      Wins: 0, Losses: 0, Ties: 0
    </p>

    <button class="button" onclick="resetScore()">
      Reset Score
    </button>


    <script>

      const score = {
        wins: 0,
        losses: 0,
        ties: 0
      };


      function playGame(playerMove) {

        let computerMove = Math.random();

        if (computerMove >= 0 && computerMove < 1 / 3) {
          computerMove = 'Rock';

        } else if (computerMove >= 1 / 3 && computerMove < 2 / 3) {
          computerMove = 'Paper';

        } else {
          computerMove = 'Scissors';
        }


        let result;

        if (playerMove === computerMove) {

          result = 'Tie.';
          document.querySelector('.result-two').innerHTML=result;

        } else if (
          (playerMove === 'Rock' && computerMove === 'Scissors') ||
          (playerMove === 'Paper' && computerMove === 'Rock') ||
          (playerMove === 'Scissors' && computerMove === 'Paper')
        ) {

          result = 'You win.';
          document.querySelector('.result-two').innerHTML=result;

        } else {

          result = 'You lose.';
          document.querySelector('.result-two').innerHTML=result;

        }


        if (playerMove==='Rock') {
          document.querySelector('.human').src='images lesson6/rock-emoji.png';

        } else if (playerMove==='Scissors') {
          document.querySelector('.human').src='images lesson6/scissors-emoji.png';

        } else if (playerMove==='Paper') {
          document.querySelector('.human').src='images lesson6/paper-emoji.png';
        }


        if (computerMove==='Rock') {
          document.querySelector('.computer').src='images lesson6/rock-emoji.png';

        } else if (computerMove==='Scissors') {
          document.querySelector('.computer').src='images lesson6/scissors-emoji.png';

        } else if (computerMove==='Paper') {
          document.querySelector('.computer').src='images lesson6/paper-emoji.png';
        }


        document.querySelector('.result-three').style.display = 'block';


        if (result === 'You win.') {

          score.wins += 1;

        } else if (result === 'You lose.') {

          score.losses += 1;

        } else {

          score.ties += 1;

        }


        document.querySelector('.result').innerHTML =
          `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
      }


      function resetScore() {

        score.wins = 0;
        score.losses = 0;
        score.ties = 0;

        document.querySelector('.result').innerHTML =
          `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;

        document.querySelector('.result-two').innerHTML = '';

        document.querySelector('.human').src = '';
        document.querySelector('.computer').src = '';

        document.querySelector('.result-three').style.display = 'none';
      }

    </script>

  </body>
</html>
